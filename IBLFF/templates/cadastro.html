<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Cadastro de pessoas no IBLFF" />
    <title>IBLFF | Cadastro</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="app-body">
    <header class="app-header">
      <a class="app-logo" href="dashboard.html"
        ><span class="brand-mark">IB</span><strong>IBLFF</strong></a
      >
      <nav class="app-nav" aria-label="Navegação principal">
        <a href="dashboard.html">Painel</a
        ><a class="active" href="cadastro.html">Cadastros</a
        ><a href="chamada.html">Chamada</a
        ><a href="relatorios.html">Relatórios</a
        ><a href="modalidades.html">Modalidades</a>
      </nav>
      <a class="outline-button small-button" href="index.html">Sair</a>
    </header>
    <main class="app-main">
      <div class="page-title-row">
        <div>
          <p class="eyebrow">Pessoas</p>
          <h1>Novo cadastro</h1>
          <p class="page-subtitle">
            Preencha os dados para incluir um voluntário ou beneficiário.
          </p>
        </div>
        <a class="secondary-button compact-button" href="dashboard.html"
          >Voltar ao painel</a
        >
      </div>
      <section class="surface form-surface">
        <div class="form-tabs">
          <button class="tab active" type="button">Beneficiário</button
          ><button class="tab" type="button">Voluntário</button>
        </div>
        <form class="data-form" action="dashboard.html">
          <fieldset>
            <legend>Dados pessoais</legend>
            <div class="form-grid">
              <div class="field full">
                <label for="name">Nome completo</label
                ><input
                  id="name"
                  required
                  placeholder="Digite o nome completo"
                />
              </div>
              <div class="field">
                <label for="birth">Data de nascimento</label
                ><input id="birth" type="date" required />
              </div>
              <div class="field">
                <label for="cpf">CPF</label
                ><input id="cpf" required placeholder="000.000.000-00" /><small
                  class="field-hint valid"
                  >✓ CPF disponível para cadastro</small
                >
              </div>
            </div>
          </fieldset>
          <fieldset>
            <legend>Contato e acesso</legend>
            <div class="form-grid">
              <div class="field">
                <label for="phone">Telefone</label
                ><input id="phone" required placeholder="(00) 00000-0000" />
              </div>
              <div class="field">
                <label for="email">E-mail</label
                ><input
                  id="email"
                  type="email"
                  required
                  placeholder="email@exemplo.com"
                />
              </div>
              <div class="field">
                <label for="address">Endereço</label
                ><input id="address" placeholder="Rua, número e bairro" />
              </div>
              <div class="field">
                <label for="course">Modalidade</label
                ><select id="course">
                  <option>Selecione uma modalidade</option>
                  <option>Balé</option>
                  <option>Jazz</option>
                  <option>Judô</option>
                  <option>Violino</option>
                </select>
              </div>
            </div>
          </fieldset>
          <label class="check-row"
            ><input type="checkbox" required /><span
              >Confirmo que os dados informados foram revisados e autorizo seu
              uso conforme a política de privacidade.</span
            ></label
          >
          <div class="form-actions">
            <a class="secondary-button compact-button" href="dashboard.html"
              >Cancelar</a
            ><button class="primary-button compact-button" type="submit">
              Salvar cadastro
            </button>
          </div>
        </form>
      </section>
    </main>
  </body>
</html>
