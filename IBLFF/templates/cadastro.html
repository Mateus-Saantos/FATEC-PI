<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Cadastro de pessoas no IBLFF" />
    <title>IBLFF | Cadastro</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>
  <body class="app-body">
    <header class="app-header">
      <a class="app-logo" href="{{ url_for('dashboard') }}"
        ><span class="brand-mark">IB</span><strong>IBLFF</strong></a
      >
      <nav class="app-nav" aria-label="Navegação principal">
        <a href="{{ url_for('dashboard') }}">Painel</a
        ><a class="active" href="{{ url_for('cadastro') }}">Cadastros</a
        ><a href="{{ url_for('chamada') }}">Chamada</a
        ><a href="{{ url_for('relatorios') }}">Relatórios</a
        ><a href="{{ url_for('modalidades') }}">Modalidades</a>
      </nav>
      <form method="POST" action="{{ url_for('sair') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
        <button class="outline-button small-button" type="submit">Sair</button>
      </form>
    </header>
    <main class="app-main">
      <div class="page-title-row">
        <div>
          <p class="eyebrow">Pessoas</p>
          <h1>Novo cadastro</h1>
          <p class="page-subtitle">
            Preencha os dados para incluir um voluntário ou beneficiário.
          </p>
        </div>
        <a
          class="secondary-button compact-button"
          href="{{ url_for('dashboard') }}"
          >Voltar ao painel</a
        >
      </div>

      <section class="surface form-surface">
        <div class="form-tabs">
          <button class="tab active" type="button" data-form="beneficiario">
            Beneficiário
          </button>

          <button class="tab" type="button" data-form="voluntario">
            Voluntário
          </button>
        </div>

        <div id="form-beneficiario">{% include 'form-beneficiario.html' %}</div>

        <div id="form-voluntario" hidden>
          {% include 'form-voluntario.html' %}
        </div>
      </section>
      <script>
        // ======================================================================
        // Alternar abas do formulário
        // ======================================================================
        const abas = document.querySelectorAll(".form-tabs .tab");

        const formularios = {
          beneficiario: document.getElementById("form-beneficiario"),
          voluntario: document.getElementById("form-voluntario"),
        };

        abas.forEach((aba) => {
          aba.addEventListener("click", () => {
            const selecionado = aba.dataset.form;

            abas.forEach((item) => item.classList.remove("active"));
            aba.classList.add("active");

            Object.entries(formularios).forEach(([tipo, formulario]) => {
              formulario.hidden = tipo !== selecionado;
            });
          });
        });

        // ======================================================================
        // Validação de contato
        // ======================================================================
        const form = document.getElementById("formCadastro");
        const telefone = document.getElementById("phone");
        const email = document.getElementById("email");

        function validarContato() {
          telefone.setCustomValidity("");

          if (!telefone.value.trim() && !email.value.trim()) {
            telefone.setCustomValidity(
              "Informe pelo menos um contato: telefone ou e-mail.",
            );
          }
        }

        telefone.addEventListener("input", validarContato);
        email.addEventListener("input", validarContato);

        form.addEventListener("submit", function (event) {
          validarContato();

          if (!form.checkValidity()) {
            event.preventDefault();
            form.reportValidity();
          }
        });
      </script>
    </main>
  </body>
</html>
